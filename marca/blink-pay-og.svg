    <clipPath id="recorte-tarjeta-og"><rect x="0" y="0" width="1011" height="638" rx="40"/></clipPath>
    <clipPath id="recorte-pantalla-og"><rect x="452" y="250" width="296" height="446" rx="42"/></clipPath>
  </defs>
