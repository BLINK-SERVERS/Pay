  <title>Blink Pay — imagen para compartir (OG)</title>
  <desc>Composición 1200×630 al estilo de la referencia autorizada de Apple Pay: campo azul de marca, lockup aprobado en blanco detrás y un teléfono emergiendo desde el borde inferior con la tarjeta Blink Pay y la confirmación «Listo». El lockup y el arte de la tarjeta se reproducen tal cual de los SVG maestros; sin geometría nueva de marca.</desc>
