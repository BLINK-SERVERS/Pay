<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      (function () {
        try {
          var modo = localStorage.getItem("blink-tema") || "auto";
          var html = document.documentElement;
          html.style.colorScheme =
            modo === "auto" ? "light dark" : modo === "claro" ? "light" : "dark";
          html.dataset.tema = modo;
          var oscuro =
            modo === "oscuro" ||
            (modo === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          html.classList.toggle("dark", oscuro);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", oscuro ? "#000000" : "#f2f2f7");
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Blink Pay — consulta el saldo de tu tarjeta de transporte y recarga con Pago Móvil."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Blink Pay" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Blink Pay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
